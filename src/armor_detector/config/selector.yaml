selector:
  detection_topic: /ft/detection
  target_topic:    /ft/target
  marker_topic:    /ft/target/marker
  queue_size:      2

  predict_T:    0.2     # 提前量时间
  radius:       0.205   # 车体半径
  plate_count:  4       # 装甲板面数

  lost_timeout: 0.5     # 彻底丢失超时
  dt_max:       0.5     # 最大帧间时间差
  gate_center:  0.4     # 车体中心关联波门
  face_on_min:  0.30    # 最小正对程度

  alpha_center: 0.10    # 中心位置修正增益
  beta_center:  0.002   # 中心速度修正增益
  max_speed:    2.0     # 最大平移速度限制

  alpha_theta:  0.5     # 相位修正增益
  beta_theta:   0.03    # 角速度修正增益
  face_hysteresis: 0.35 # 换面防抖滞回阈值
  max_omega:    8.0     # 最大角速度限制

  n_y_alpha:    0.2     # 法向垂直分量平滑系数

  baseline_q_pos: 1.0e-4  # 位置过程噪声
  baseline_q_vel: 3.0e-3  # 速度过程噪声
  baseline_r_pos: 1.0e-3  # 位置测量噪声